version: "3.9"

name: lunar-broker

services:
  supabase-db:
    image: supabase/postgres:15.6.1.116
    networks:
      - lunar-net
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  redis:
    image: redis:7-alpine
    networks:
      - lunar-net
    volumes:
      - redisdata:/data
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    networks:
      - lunar-net
    volumes:
      - natsdata:/data
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  gateway:
    image: lunar-broker/gateway:latest
    networks:
      - lunar-net
    ports:
      - "8080:8080"
    environment:
      SUPABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me}
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 512M

  rust-api:
    image: lunar-broker/rust-api:latest
    networks:
      - lunar-net
    ports:
      - "8081:8081"
    environment:
      SUPABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        reservations:
          memory: 512M
        limits:
          memory: 1G

  python-api:
    image: lunar-broker/python-api:latest
    networks:
      - lunar-net
    ports:
      - "8082:8082"
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 1G

  frontend:
    image: lunar-broker/frontend:latest
    networks:
      - lunar-net
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://gateway:8080
    deploy:
      replicas: 2
      resources:
        reservations:
          memory: 256M
        limits:
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    networks:
      - lunar-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      replicas: 2
      placement:
        constraints: [node.role == manager]

networks:
  lunar-net:
    driver: overlay

volumes:
  pgdata:
  redisdata:
  natsdata:
