name: lunar-broker-proxy

services:
  nginx:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs:/var/log/nginx
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - rust-api
      - python-api
      - julia-api
      - frontend
    networks:
      - lunar-broker_default

networks:
  lunar-broker_default:
    external: true
