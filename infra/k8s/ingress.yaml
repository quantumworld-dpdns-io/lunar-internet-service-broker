apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lunar-broker-ingress
  namespace: lunar-broker
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - lunar-broker.example.com
      secretName: lunar-broker-tls
  rules:
    - host: lunar-broker.example.com
      http:
        paths:
          - path: /api/v1/auth
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /api/v1/matching
            pathType: Prefix
            backend:
              service:
                name: rust-api
                port:
                  number: 8081
          - path: /api/v1/ai
            pathType: Prefix
            backend:
              service:
                name: python-api
                port:
                  number: 8082
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
