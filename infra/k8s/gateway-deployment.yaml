apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lunar-broker
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: lunar-broker/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lunar-broker-secrets
                  key: supabase-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lunar-broker-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lunar-broker
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
