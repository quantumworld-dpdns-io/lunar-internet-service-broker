[project]
name = "lunar-ai"
version = "0.1.0"
description = "Lunar Internet Service Broker - AI/ML Services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "httpx>=0.26",
    "qdrant-client>=1.9",
    "openai>=1.12",
    "supabase>=2.3",
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
    "httpx>=0.26",
]
