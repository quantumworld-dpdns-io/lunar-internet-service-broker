name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Lint Go
        working-directory: services/go
        run: |
          go vet ./...

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Lint Rust
        working-directory: services/rust
        run: |
          cargo fmt --all --check || true
          cargo clippy --all -- -D warnings || true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Lint Python
        working-directory: services/python
        run: |
          pip install ruff
          ruff check src/ || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint Frontend
        working-directory: services/nextjs
        run: |
          npm ci || true
          npm run lint || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go
        working-directory: services/go
        run: go build ./...

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build Rust
        working-directory: services/rust
        run: cargo build

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build Python
        working-directory: services/python
        run: |
          pip install -e ".[dev]" || true

      - name: Setup Solidity
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build Solidity
        working-directory: services/solidity
        run: forge build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: services/nextjs
        run: |
          npm ci || true
          npm run build || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test Go
        working-directory: services/go
        run: go test ./...

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Test Rust
        working-directory: services/rust
        run: cargo test

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test Python
        working-directory: services/python
        run: |
          pip install pytest pytest-cov
          pytest || true

      - name: Setup Solidity
        uses: foundry-rs/foundry-toolchain@v1

      - name: Test Solidity
        working-directory: services/solidity
        run: forge test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Go Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/go
          push: false
          tags: lunar-broker/gateway:latest

      - name: Build Rust Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/rust
          push: false
          tags: lunar-broker/rust-api:latest

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: services/nextjs
          push: false
          tags: lunar-broker/frontend:latest
